name: Validate and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore supplied wallpaper and avatar assets
        run: |
          mkdir -p public/story-assets src/story-assets
          for name in p1.jpg p2.jpg p3.jpg; do
            unzip -p FoundPhone-Studio-modified.zip "FoundPhone-Studio-main/public/story-assets/$name" > "public/story-assets/$name"
            cp "public/story-assets/$name" "src/story-assets/$name"
          done
          # Publish uploaded Photos-library images as static assets too.
          for name in baby-panda.jpg riku-selfie.jpg baby-cute.jpg photo-03.jpg photo-04.jpg photo-06.jpg photo-07.jpg photo-08.jpg photo-09.jpg photo-10.jpg photo-11.jpg photo-12.JPG photo-13.JPG photo-14.jpg photo-15.jpg; do
            cp "story-assets/$name" "public/story-assets/$name"
          done
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run story:validate
      - run: npm run story:test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
