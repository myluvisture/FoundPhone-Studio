name: Validate and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore supplied wallpaper and avatar assets
        run: |
          mkdir -p public/story-assets src/story-assets
          for name in p1.jpg p2.jpg p3.jpg; do
            unzip -p FoundPhone-Studio-modified.zip "FoundPhone-Studio-main/public/story-assets/$name" > "public/story-assets/$name"
            cp "public/story-assets/$name" "src/story-assets/$name"
          done
          # Publish uploaded Photos-library images as static assets too.
          for name in baby-panda.jpg riku-selfie.jpg baby-cute.jpg photo-03.jpg photo-04.jpg photo-06.jpg photo-07.jpg photo-08.jpg photo-09.jpg photo-10.jpg photo-11.jpg photo-12.JPG photo-12.jpg photo-13.JPG photo-13.jpg photo-14.jpg photo-15.jpg pig-01.jpg pig-02.jpg pig-03.jpg pig-04.jpg pig-05.jpg pig-06.jpg pig-07.jpg pig-08.jpg pig-09.jpg pig-010.jpg; do
            cp "story-assets/$name" "public/story-assets/$name"
          done
          # Optional Instagram post images are uploaded into the repository-root story-assets folder.
          # Any file named *-post.jpg is published automatically, including future posts.
          for source in story-assets/*-post*.jpg; do
            [ -f "$source" ] || continue
            name="${source##*/}"
            cp "$source" "public/story-assets/$name"
          done
          # Optional avatar for ri_ku_03 in Saku's Instagram follower/following lists.
          if [ -f "story-assets/riku-avatar.jpg" ]; then
            cp "story-assets/riku-avatar.jpg" "public/story-assets/riku-avatar.jpg"
          else
            echo "Optional Riku avatar not uploaded yet: story-assets/riku-avatar.jpg"
          fi
      - name: Convert mislabeled HEIC photos to browser-compatible JPEG
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-examples libheif-plugin-libde265 imagemagick
          for name in baby-panda.jpg riku-selfie.jpg baby-cute.jpg photo-03.jpg photo-04.jpg photo-06.jpg photo-07.jpg photo-08.jpg photo-09.jpg photo-10.jpg photo-11.jpg photo-12.JPG photo-12.jpg photo-13.JPG photo-13.jpg photo-14.jpg photo-15.jpg pig-01.jpg pig-02.jpg pig-03.jpg pig-04.jpg pig-05.jpg pig-06.jpg pig-07.jpg pig-08.jpg pig-09.jpg pig-010.jpg; do
            source="story-assets/$name"
            target="public/story-assets/$name"
            description="$(file -b "$source")"
            if echo "$description" | grep -qiE 'HEIF|HEIC'; then
              temp="public/story-assets/${name%.*}.converted.jpg"
              echo "Converting mislabeled HEIC photo: $name"
              heif-convert "$source" "$temp"
              mv "$temp" "$target"
            fi
          done
          # The uploaded Instagram avatar is required to be a real JPEG at build time.
          # GitHub can store PNG bytes under a .jpg filename, so detect by content, not extension.
          avatar="public/story-assets/instagram-avatar.jpg"
          if [ -f "$avatar" ]; then
            mime="$(file --mime-type -b "$avatar")"
            case "$mime" in
              image/jpeg)
                echo "Instagram avatar is already a valid JPEG."
                ;;
              image/png|image/webp|image/gif|image/tiff|image/bmp|image/heic|image/heif|image/avif)
                temp="public/story-assets/instagram-avatar.converted.jpg"
                echo "Converting Instagram avatar from $mime to JPEG."
                convert "$avatar" -auto-orient -background white -alpha remove -alpha off -strip -quality 92 "$temp"
                mv "$temp" "$avatar"
                ;;
              *)
                echo "Unsupported Instagram avatar MIME type: $mime"
                exit 1
                ;;
            esac
          else
            echo "Instagram avatar not uploaded yet; skipping avatar conversion."
          fi
          # Optional Instagram relationship avatar. Convert based on actual file format, not extension.
          riku_avatar="public/story-assets/riku-avatar.jpg"
          if [ -f "$riku_avatar" ]; then
            mime="$(file --mime-type -b "$riku_avatar")"
            case "$mime" in
              image/jpeg)
                echo "Riku avatar is already a valid JPEG."
                ;;
              image/heic|image/heif|image/heic-sequence|image/heif-sequence)
                temp="public/story-assets/riku-avatar.converted.jpg"
                echo "Converting Riku avatar from $mime to JPEG with heif-convert."
                heif-convert "$riku_avatar" "$temp"
                mv "$temp" "$riku_avatar"
                ;;
              image/png|image/webp|image/gif|image/tiff|image/bmp|image/avif)
                temp="public/story-assets/riku-avatar.converted.jpg"
                echo "Converting Riku avatar from $mime to JPEG."
                convert "$riku_avatar" -auto-orient -background white -alpha remove -alpha off -strip -quality 92 "$temp"
                mv "$temp" "$riku_avatar"
                ;;
              *)
                echo "Unsupported Riku avatar MIME type: $mime"
                exit 1
                ;;
            esac
          else
            echo "Optional Riku avatar not uploaded yet; skipping avatar conversion."
          fi
          # Ensure each optional Instagram post image is really a JPEG, not merely named .jpg.
          # The wildcard keeps new posts upload-only: no workflow edit is needed for each image.
          for post_image in public/story-assets/*-post*.jpg; do
            [ -f "$post_image" ] || continue
            name="${post_image##*/}"
            mime="$(file --mime-type -b "$post_image")"
            case "$mime" in
              image/jpeg)
                echo "Instagram post image $name is already a valid JPEG."
                ;;
              image/heic|image/heif|image/heic-sequence|image/heif-sequence)
                temp="public/story-assets/${name%.jpg}.converted.jpg"
                echo "Converting Instagram post image $name from $mime to JPEG with heif-convert."
                heif-convert "$post_image" "$temp"
                mv "$temp" "$post_image"
                ;;
              image/png|image/webp|image/gif|image/tiff|image/bmp|image/avif)
                temp="public/story-assets/${name%.jpg}.converted.jpg"
                echo "Converting Instagram post image $name from $mime to JPEG."
                convert "$post_image" -auto-orient -background white -alpha remove -alpha off -strip -quality 92 "$temp"
                mv "$temp" "$post_image"
                ;;
              *)
                echo "Unsupported Instagram post image MIME type for $name: $mime"
                exit 1
                ;;
            esac
          done
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run story:validate
      - run: npm run story:test
      - run: npm run build
      - name: Publish the read-only sari-sakuya-phone player path
        run: |
          mkdir -p dist/sari-sakuya-phone
          cp dist/index.html dist/sari-sakuya-phone/index.html
          test -s dist/sari-sakuya-phone/index.html
      - name: Verify published story image assets are real JPEGs
        run: |
          for name in instagram-avatar.jpg baby-panda.jpg riku-selfie.jpg baby-cute.jpg photo-03.jpg photo-04.jpg photo-06.jpg photo-07.jpg photo-08.jpg photo-09.jpg photo-10.jpg photo-11.jpg photo-12.JPG photo-12.jpg photo-13.JPG photo-13.jpg photo-14.jpg photo-15.jpg pig-01.jpg pig-02.jpg pig-03.jpg pig-04.jpg pig-05.jpg pig-06.jpg pig-07.jpg pig-08.jpg pig-09.jpg pig-010.jpg; do
            path="dist/story-assets/$name"
            test -s "$path" || { echo "Missing published image: $name"; exit 1; }
            mime="$(file --mime-type -b "$path")"
            test "$mime" = "image/jpeg" || { echo "Not browser-ready JPEG: $name ($mime)"; exit 1; }
          done
          for source in story-assets/*-post*.jpg; do
            [ -f "$source" ] || continue
            name="${source##*/}"
            path="dist/story-assets/$name"
            test -s "$path" || { echo "Missing published Instagram post image: $path"; exit 1; }
            mime="$(file --mime-type -b "$path")"
            test "$mime" = "image/jpeg" || { echo "Instagram post image $name is not a valid JPEG: $mime"; exit 1; }
          done
          if [ -f "story-assets/riku-avatar.jpg" ]; then
            path="dist/story-assets/riku-avatar.jpg"
            test -s "$path" || { echo "Missing published Riku avatar: $path"; exit 1; }
            mime="$(file --mime-type -b "$path")"
            test "$mime" = "image/jpeg" || { echo "Riku avatar is not a valid JPEG: $mime"; exit 1; }
          else
            echo "Optional Riku avatar not uploaded yet; skipping avatar verification."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
